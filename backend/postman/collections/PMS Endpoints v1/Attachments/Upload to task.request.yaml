$kind: http-request
name: Upload to task
description: |-
  Tải file lên task. Trong Postman: tab Body -> form-data -> key "file" kiểu File.

  Whitelist 9 bước: 400 tên file có ý đồ / đuôi kép / nội dung không khớp đuôi đã khai (magic number); 413 quá 20MB; 415 đuôi hoặc content-type ngoài whitelist; 403 Viewer.
url: "{{api_url}}/tasks/:task_id/attachments"
method: POST
pathVariables:
  - key: task_id
    value: 8DD5602C-EB76-4E72-BFF4-707011B0E6AF
    description: Task liên quan
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
      description: ""
      disabled: false
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 1785500016000
