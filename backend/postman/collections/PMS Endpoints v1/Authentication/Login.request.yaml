$kind: http-request
name: Login
url: "{{api_url}}/auth/login"
method: POST
body:
  type: json
  content: |
    {
        "email": "phuc@pms.local",
        "password": "Password123!"
    }
auth:
  type: noauth
description: |-
  Thân phản hồi CỐ Ý không còn `refreshToken` (ADR-027) — nó về bằng cookie httpOnly  
  `pms_refresh_token` mà Postman tự lưu vào cookie jar. Biến môi trường `refresh_token`  
  không còn dùng nữa và đã bị bỏ.
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      if (pm.response.code === 200 && response.accessToken) {
          pm.environment.set("access_token", response.accessToken);
          console.log("Access token saved. Refresh token nằm trong cookie httpOnly.");
      } else {
          console.log("No token found.");
      }
    language: text/javascript
order: 1610595385014526
