$kind: http-request
name: Reset password
description: |-
  Đặt lại mật khẩu bằng mã lấy từ email (ADR-041).

  Token sai / hết hạn / đã dùng đều trả CÙNG MỘT 400 với cùng thông điệp — đừng cố suy ra nguyên nhân cụ thể, thông tin đó cố tình không có.

  Thành công thì TOÀN BỘ phiên bị thu hồi (kể cả thiết bị khác) và cookie refresh bị xóa -> phải đăng nhập lại. Mật khẩu mới theo đúng chính sách của Register (>=8 ký tự, có hoa/thường/số).
