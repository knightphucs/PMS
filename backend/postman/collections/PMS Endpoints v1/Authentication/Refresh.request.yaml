$kind: http-request
name: Refresh
url: "{{api_url}}/auth/refresh"
method: POST
auth:
  type: noauth
description: |-
  Không có body: refresh token đi bằng cookie httpOnly `pms_refresh_token` (ADR-027).
  Postman tự quản lý cookie jar theo domain nên chỉ cần chạy Login/Register trước là
  cookie có sẵn — không phải copy token bằng tay nữa.

  Cookie có `Path=/api/v1/auth`, mà Path của cookie PHÂN BIỆT HOA THƯỜNG (route ASP.NET
  thì không). Gọi `{{api_url}}/Auth/refresh` chữ A hoa vẫn trúng route nhưng cookie sẽ
  KHÔNG được đính kèm và bạn nhận 401 — giữ nguyên chữ thường trong url.

  ⚠️ Rotation + reuse detection: bấm Send hai lần liên tiếp thì lần hai dùng lại token đã
  bị thu hồi, bị coi là token bị đánh cắp và TOÀN BỘ phiên bị thu hồi. Sau lần đó phải
  đăng nhập lại.
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      if (pm.response.code === 200 && response.accessToken) {
          pm.environment.set("access_token", response.accessToken);
          console.log("Access token refreshed.");
      } else {
          console.log("Refresh failed — có cookie pms_refresh_token chưa?");
      }
    language: text/javascript
order: 2728327025821395
